<!DOCTYPE html>
<!--
  Privacy review for replay.py. Generated by `python replay.py sample`, which
  inlines the sample where the placeholder below sits.

  Nothing on this page sends anything. It opens from file://, makes no network
  requests, and its only output is a small approval file that you download.
  replay.py run refuses to send any prompt that file does not list.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review prompts</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e2e2e2;
    --panel: #fafafa; --warn: #8a5a00; --warnbg: #fdf3dc; --ok: #1c7a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2e3238;
      --panel: #1c1f24; --warn: #e3bd62; --warnbg: #3a2f14; --ok: #6ecf9a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 12px 20px;
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
  .banner { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            padding: 14px 16px; margin-bottom: 22px; }
  .banner p { margin: 0 0 8px; }
  .banner p:last-child { margin: 0; }
  .banner ul { margin: 4px 0 10px; padding-left: 20px; }
  .note { color: var(--warn); }
  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 8px;
       display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h2 .muted { font-weight: 400; }
  .row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px;
         padding: 10px 0; border-top: 1px solid var(--line); }
  .row input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; cursor: pointer; }
  .row.off .text { color: var(--muted); }
  .text { white-space: pre-wrap; word-break: break-word; }
  .num { float: left; min-width: 3.2em; font-weight: 600; color: var(--muted);
         font-variant-numeric: tabular-nums; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .chip { font-size: 12px; padding: 1px 8px; border-radius: 10px;
          background: var(--warnbg); color: var(--warn); }
  select { font: inherit; font-size: 12px; padding: 2px 4px; border-radius: 5px;
           border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px;
           cursor: pointer; border: 1px solid var(--line); background: var(--panel);
           color: var(--fg); }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg);
                   font-size: 14px; padding: 7px 16px; }
  .spacer { flex: 1; }
</style>

<header>
  <h1>Review before anything is sent</h1>
  <span class="muted" id="count"></span>
  <span class="spacer"></span>
  <button class="primary" id="dl">Download approval</button>
</header>

<div class="wrap">
  <div class="banner" id="banner"></div>
  <div id="list"></div>
</div>

<script>
const SAMPLE = /*__SAMPLE__*/null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

const KEY = "replay_review_" + SAMPLE.sample_id;
const state = { on: {}, topic: {} };
for (const it of SAMPLE.items) state.on[it.id] = it.default;
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved) { Object.assign(state.on, saved.on || {}); Object.assign(state.topic, saved.topic || {}); }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

function banner() {
  const provs = SAMPLE.providers.map(p =>
    `<li><b>${esc(p.name)}</b>: ${p.models.map(esc).join(", ")}` +
    (p.note ? ` <span class="note">${esc(p.note)}</span>` : "") + `</li>`).join("");
  $("#banner").innerHTML = `
    <p>Nothing has left your computer. These are opening prompts from your own
    conversations. Only the ticked ones will be sent, each to two of these models:</p>
    <ul>${provs}</ul>
    <p>Each model gets the same instruction first: <i>${esc(SAMPLE.system)}</i></p>
    <p>Prompts flagged as possibly private start unticked. The filters can't catch
    other people's names, so skim for those too. Your ticks save as you go.</p>
    <p>No download needed if you'd rather not: tell Claude something like
    <i>"defaults, drop 12 and 47, add 160"</i> using the numbers below, and it
    runs <code>replay.py approve</code> for you.</p>`;
}

function topicOf(it) { return state.topic[it.id] || it.topic; }

function render() {
  const groups = {};
  for (const it of SAMPLE.items) (groups[it.topic] = groups[it.topic] || []).push(it);
  const opts = Object.entries(SAMPLE.topics);
  $("#list").innerHTML = Object.keys(SAMPLE.topics).filter(t => groups[t]).map(t => {
    const items = groups[t];
    const rows = items.map(it => {
      const long = it.text.length > 360;
      const body = long
        ? `<div class="text">${esc(it.text.slice(0, 360))}…</div>
           <details><summary>show all ${it.words} words</summary><div class="text">${esc(it.text)}</div></details>`
        : `<div class="text">${esc(it.text)}</div>`;
      return `<div class="row ${state.on[it.id] ? "" : "off"}" data-id="${it.id}">
        <input type="checkbox" aria-label="send prompt ${it.n}" ${state.on[it.id] ? "checked" : ""}>
        <div><span class="num">#${it.n}</span>${body}
          <div class="meta">
            ${it.flags.map(f => `<span class="chip">${esc(f)}</span>`).join("")}
            <span class="muted">${esc(it.title)}</span>
            <select aria-label="topic">${opts.map(([k, label]) =>
              `<option value="${k}" ${topicOf(it) === k ? "selected" : ""}>${esc(label)}</option>`).join("")}</select>
          </div>
        </div>
      </div>`;
    }).join("");
    return `<h2>${esc(SAMPLE.topics[t])} <span class="muted" data-count="${t}"></span>
              <button data-all="${t}">Tick unflagged</button><button data-none="${t}">Untick all</button></h2>${rows}`;
  }).join("");

  document.querySelectorAll(".row").forEach(row => {
    const id = row.dataset.id;
    row.querySelector("input").addEventListener("change", e => {
      state.on[id] = e.target.checked; row.classList.toggle("off", !e.target.checked);
      save(); counts();
    });
    row.querySelector("select").addEventListener("change", e => {
      state.topic[id] = e.target.value; save();
    });
  });
  // A group tick never opts in a flagged prompt: those take their own click,
  // so "untick all, tick all" to reset cannot quietly send something private.
  const setGroup = (t, v) => {
    for (const it of groups[t]) if (!v || !it.flags.length) state.on[it.id] = v;
    save(); render();
  };
  document.querySelectorAll("[data-all]").forEach(b => b.onclick = () => setGroup(b.dataset.all, true));
  document.querySelectorAll("[data-none]").forEach(b => b.onclick = () => setGroup(b.dataset.none, false));
  counts();
}

function counts() {
  const on = SAMPLE.items.filter(it => state.on[it.id]).length;
  $("#count").textContent = `${on} of ${SAMPLE.items.length} ticked`;
  document.querySelectorAll("[data-count]").forEach(el => {
    const t = el.dataset.count;
    const g = SAMPLE.items.filter(it => it.topic === t);
    el.textContent = `${g.filter(it => state.on[it.id]).length} of ${g.length} ticked`;
  });
}

$("#dl").onclick = () => {
  const include = SAMPLE.items.filter(it => state.on[it.id]).map(it => it.id);
  if (!include.length) { alert("Nothing is ticked, so there is nothing to approve."); return; }
  const topics = {};
  for (const it of SAMPLE.items) if (state.topic[it.id] && state.topic[it.id] !== it.topic) topics[it.id] = state.topic[it.id];
  const out = {
    sample_id: SAMPLE.sample_id,
    approved_at: new Date().toISOString(),
    providers: SAMPLE.providers.map(p => p.name),
    include, topics,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `approved_${SAMPLE.sample_id}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

banner();
render();
</script>
