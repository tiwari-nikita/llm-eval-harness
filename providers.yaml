# Provider config for runner.py. All three expose an OpenAI-compatible
# /chat/completions endpoint, so the runner needs exactly one HTTP client.
#
# Model IDs on free tiers change often and are the most likely thing here
# to be stale by the time you read this. Verify against the provider's
# current docs before a real run; the runner will surface a clear HTTP
# error (404/400 on unknown model) rather than fail silently either way.
#
# Set the API key as an environment variable, never in this file:
#   setx GROQ_API_KEY "..."      (new shells only, or use $env: for this one)
#   $env:GROQ_API_KEY = "..."
#
# No provider here requires a card for the tier used.

groq:
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  # llama-3.1-8b-instant / llama-3.3-70b-versatile (the previous entries here)
  # both 404 as of 2026-08-22 — Groq had retired them. Replaced after
  # checking the live list with `curl .../v1/models`. Re-check the same way
  # if this 404s again; free-tier model IDs are the least stable part of
  # any of these configs.
  models:
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b

openrouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  # Verified against https://openrouter.ai/api/v1/models (live, pricing=0)
  # on 2026-08-24. This list drifts fast — run `python router.py
  # check-catalogue` before a real run, it flags any model here that's no
  # longer free. nvidia/nemotron-3-nano-30b-a3b:free (previous entry here)
  # fell off the free list between 2026-08-22 and 2026-08-24; swapped for
  # its apparent successor.
  models:
    - google/gemma-4-31b-it:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free

google:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: GOOGLE_API_KEY
  # Verified live 2026-08-26 by POSTing each ID to the OpenAI-compatible
  # endpoint above, not by reading a docs page. gemini-1.5-flash (the previous
  # entry here) is gone, and so is gemini-2.5-flash -- that one 404s with "no
  # longer available to new users", which a model-list fetch alone would not
  # have caught, since the list still advertises it.
  #
  # Worth knowing before setting max_tokens: 3.6-flash and 3.5-flash spend a
  # hidden reasoning budget before emitting text (121 and 100 tokens
  # respectively to answer "reply with the single word: ok"), the same trait
  # that made gpt-oss return empty content at a small cap. flash-lite does not
  # -- it answered in 9.
  #
  # Google does not publish per-model pricing on the models endpoint, so
  # catalogue.py reports these as free-status unknown rather than guessing.
  #
  # The binding limit here is requests per day, per model, and it is small
  # enough to dictate roles. gemini-3.6-flash reports
  # GenerateRequestsPerDayPerProjectPerModel-FreeTier with quotaValue 20 --
  # twenty requests a day. Grading one category costs twelve. So 3.6-flash is
  # reserved as the *grader* and deliberately kept out of the list below; it
  # cannot be a model under test and a grader on the same day. Discovered by
  # exhausting it, since no header advertises the limit and a 200 response
  # says nothing about what remains.
  models:
    - gemini-3.5-flash
    - gemini-3.5-flash-lite
