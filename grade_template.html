<!DOCTYPE html>
<!--
  Blind pairwise grading page. Generated by make_grading_bundle.py, which
  inlines the transcript bundle where the placeholder below sits.

  Deliberately one file with no external requests: it has to work from
  file://, offline, on someone else's machine, without an install or an
  account. Nothing here is loaded from a CDN for that reason.

  It contains no model names. Side A and B are randomised per task by the
  generator and the mapping lives in a file the grader never receives.
-->
<meta charset="utf-8">
<title>Blind pairwise grading</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e2e2e2;
    --a: #2b5faa; --b: #a1500f; --ok: #1c7a4a; --warn: #9a6b00;
    --panel: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2e3238;
      --a: #7aa7e8; --b: #e0a06a; --ok: #6ecf9a; --warn: #d8b459;
      --panel: #1c1f24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .prog { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
  .prompt {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 18px;
  }
  .prompt .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
                 color: var(--muted); margin-bottom: 4px; }
  .turn { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 18px; }
  .turnno { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 8px; }
  .user {
    background: var(--panel); border-left: 3px solid var(--muted);
    padding: 10px 14px; margin-bottom: 14px; white-space: pre-wrap;
  }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .col { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .col > .head {
    padding: 6px 12px; font-weight: 600; font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  .col.a > .head { color: var(--a); }
  .col.b > .head { color: var(--b); }
  .body { padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
  .body table { border-collapse: collapse; margin: 8px 0; width: 100%;
                white-space: normal; font-size: 13px; }
  .body th, .body td { border: 1px solid var(--line); padding: 5px 8px;
                       text-align: left; vertical-align: top; }
  .body th { background: var(--panel); font-weight: 600; }
  .body pre { background: var(--panel); border: 1px solid var(--line);
              border-radius: 5px; padding: 8px 10px; overflow-x: auto;
              white-space: pre; font-size: 12.5px; }
  .body code { background: var(--panel); padding: 1px 4px; border-radius: 3px;
               font-size: 12.5px; }
  .body .mdh { display: block; font-weight: 700; margin: 10px 0 2px; }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .cut { color: var(--warn); font-size: 12px; padding: 0 14px 10px; }
  .votes { margin-top: 26px; border-top: 2px solid var(--line); padding-top: 18px; }
  .dim { display: flex; align-items: baseline; gap: 14px; padding: 9px 0;
         border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .dim .name { font-weight: 600; min-width: 160px; }
  .dim .hint { color: var(--muted); font-size: 13px; flex: 1 1 280px; }
  .opts { display: flex; gap: 6px; }
  .opts label {
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 14px;
    cursor: pointer; font-size: 13px; user-select: none;
  }
  .opts input { position: absolute; opacity: 0; width: 0; height: 0; }
  .opts label:hover { border-color: var(--muted); }
  .opts input:checked + span { font-weight: 700; }
  .opts label:has(input[value="a"]:checked) { border-color: var(--a); color: var(--a); }
  .opts label:has(input[value="b"]:checked) { border-color: var(--b); color: var(--b); }
  .opts label:has(input[value="tie"]:checked) { border-color: var(--muted); }
  .note { width: 100%; margin-top: 12px; padding: 8px 10px; font: inherit;
          font-size: 14px; background: var(--bg); color: var(--fg);
          border: 1px solid var(--line); border-radius: 6px; }
  .nav { display: flex; gap: 10px; align-items: center; margin: 24px 0 60px; }
  button {
    font: inherit; padding: 8px 18px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .done { color: var(--ok); font-weight: 600; }
  .warnbox { color: var(--warn); font-size: 13px; }
  #whoRow { display: flex; gap: 8px; align-items: center; }
  #who { font: inherit; padding: 5px 9px; border: 1px solid var(--line);
         border-radius: 6px; background: var(--bg); color: var(--fg); width: 150px; }
</style>

<header>
  <h1>Blind pairwise grading</h1>
  <span class="prog" id="prog"></span>
  <span id="whoRow"><label for="who" class="prog">your name</label>
    <input id="who" placeholder="e.g. nikita"></span>
  <span style="flex:1"></span>
  <button id="dl" class="primary">Download votes</button>
</header>

<div class="wrap" id="app"></div>

<script>
const BUNDLE = /*__BUNDLE__*/null;

const state = {
  i: 0,
  votes: {},   // task_id -> {dim: "a"|"b"|"tie"}
  notes: {},   // task_id -> string
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// Minimal markdown rendering. These models answer in heavy markdown -- one of
// them favours large tables -- and shown raw, a table is unreadable pipe soup.
// Since how an answer is organised is part of what the grader is ranking,
// leaving it unrendered actively distorts the comparison.
//
// Everything is HTML-escaped first and only then given tags, so transcript
// text can never introduce markup of its own.
function md(src) {
  let s = esc(src);

  s = s.replace(/```[a-z]*\n([\s\S]*?)```/gi, (m, c) => `<pre>${c}</pre>`);

  // tables: a run of pipe-delimited lines, with the |---|---| divider dropped
  s = s.replace(/(?:^\|.*\|[ \t]*\n?){2,}/gm, (block) => {
    const rows = block.trimEnd().split("\n")
      .map(r => r.trim()).filter(r => r.startsWith("|"));
    const cells = rows.map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    const isDivider = (row) => row.every(c => /^:?-{2,}:?$/.test(c));
    const body = cells.filter(r => !isDivider(r));
    if (body.length < 2) return block;
    const head = body[0], rest = body.slice(1);
    return "<table><thead><tr>" + head.map(c => `<th>${c}</th>`).join("")
      + "</tr></thead><tbody>"
      + rest.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("")
      + "</tbody></table>";
  });

  s = s.replace(/^\s*#{1,6}\s+(.+)$/gm, '<span class="mdh">$1</span>');
  s = s.replace(/^\s*(?:---+|___+|\*\*\*+)\s*$/gm, "<hr>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<i>$2</i>");
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/^([ \t]*)[-*+][ \t]+/gm, "$1• ");
  s = s.replace(/<br>/g, "");
  return s;
}

function cutNote(list, side) {
  if (!list || !list.length) return "";
  const t = list.length === 1 ? "turn " + list[0] : "turns " + list.join(", ");
  return `<div class="cut">Note: ${side} was cut off at the length cap on ${t}. ` +
         `That is the harness stopping it, not the model finishing — weigh it as you see fit.</div>`;
}

function render() {
  const task = BUNDLE.tasks[state.i];
  const v = state.votes[task.task_id] || {};
  const turns = task.turns.map((t, n) => `
    <div class="turn">
      <div class="turnno">turn ${n + 1}</div>
      <div class="user">${esc(t.user)}</div>
      <div class="cols">
        <div class="col a"><div class="head">A</div><div class="body">${md(t.a)}</div></div>
        <div class="col b"><div class="head">B</div><div class="body">${md(t.b)}</div></div>
      </div>
    </div>`).join("");

  const dims = BUNDLE.dimensions.map(d => `
    <div class="dim">
      <span class="name">${esc(d.name)}</span>
      <span class="hint">${esc(d.hint)}</span>
      <span class="opts">
        ${["a", "tie", "b"].map(opt => `
          <label><input type="radio" name="${esc(d.name)}" value="${opt}"
            ${v[d.name] === opt ? "checked" : ""}><span>${opt === "tie" ? "tie" : opt.toUpperCase()}</span></label>`).join("")}
      </span>
    </div>`).join("");

  $("#app").innerHTML = `
    <div class="prompt">
      <div class="lbl">task ${esc(task.task_id)} · both sides received identical prompts</div>
      Read both, then rank A against B on each dimension. You are not scoring
      them out of ten — only saying which one did better, or tie.
    </div>
    ${cutNote(task.a_truncated, "A")}${cutNote(task.b_truncated, "B")}
    ${turns}
    <div class="votes">${dims}
      <input class="note" id="note" placeholder="optional: why? (recorded with the vote)"
             value="${esc(state.notes[task.task_id] || "")}">
    </div>
    <div class="nav">
      <button id="prev" ${state.i === 0 ? "disabled" : ""}>Previous</button>
      <button id="next" class="primary" ${state.i >= BUNDLE.tasks.length - 1 ? "disabled" : ""}>Next</button>
      <span id="status" class="warnbox"></span>
    </div>`;

  $("#app").querySelectorAll('input[type=radio]').forEach(el => {
    el.addEventListener("change", () => {
      state.votes[task.task_id] = state.votes[task.task_id] || {};
      state.votes[task.task_id][el.name] = el.value;
      save(); updateStatus();
    });
  });
  $("#note").addEventListener("input", (e) => {
    state.notes[task.task_id] = e.target.value; save();
  });
  $("#prev").onclick = () => { state.i--; render(); window.scrollTo(0, 0); };
  $("#next").onclick = () => { state.i++; render(); window.scrollTo(0, 0); };

  $("#prog").textContent = `pair ${state.i + 1} of ${BUNDLE.tasks.length} · ${completed()} complete`;
  updateStatus();
}

function completed() {
  return BUNDLE.tasks.filter(t => {
    const v = state.votes[t.task_id] || {};
    return BUNDLE.dimensions.every(d => v[d.name]);
  }).length;
}

function updateStatus() {
  const task = BUNDLE.tasks[state.i];
  const v = state.votes[task.task_id] || {};
  const missing = BUNDLE.dimensions.filter(d => !v[d.name]).length;
  const el = $("#status");
  if (!el) return;
  el.className = missing ? "warnbox" : "done";
  el.textContent = missing ? `${missing} dimension${missing > 1 ? "s" : ""} left on this pair`
                           : "this pair is complete";
  $("#prog").textContent = `pair ${state.i + 1} of ${BUNDLE.tasks.length} · ${completed()} complete`;
}

// Progress survives a closed tab. A grader who has to stop halfway should not
// lose the work and, worse, quietly not come back.
const KEY = "grading_" + BUNDLE.bundle_id;
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({votes: state.votes, notes: state.notes,
                                              who: $("#who").value}));
  } catch (e) {}
}
function restore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    state.votes = d.votes || {}; state.notes = d.notes || {};
    if (d.who) $("#who").value = d.who;
  } catch (e) {}
}

$("#who").addEventListener("input", save);

$("#dl").onclick = () => {
  const done = completed(), total = BUNDLE.tasks.length;
  if (done < total &&
      !confirm(`${done} of ${total} pairs are complete. Download anyway? `
               + `Incomplete pairs are skipped, and you can send a second file later.`)) {
    return;
  }
  const out = {
    bundle_id: BUNDLE.bundle_id,
    category: BUNDLE.category,
    grader: ($("#who").value || "anonymous").trim(),
    submitted: new Date().toISOString(),
    dimensions: BUNDLE.dimensions.map(d => d.name),
    votes: {}, notes: {},
  };
  for (const t of BUNDLE.tasks) {
    const v = state.votes[t.task_id] || {};
    if (!BUNDLE.dimensions.every(d => v[d.name])) continue;  // partial = omitted
    out.votes[t.task_id] = v;
    if (state.notes[t.task_id]) out.notes[t.task_id] = state.notes[t.task_id];
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `votes_${out.category}_${out.grader.replace(/[^a-z0-9]+/gi, "_")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

restore();
render();
</script>
