<!DOCTYPE html>
<!--
  One-keypress blind picking for replay.py. Generated by `python replay.py run`,
  which inlines the bundle where the placeholder below sits.

  It holds no model names, and it does not reveal them after a pick: after a
  few dozen reveals you would recognise each model's style and start voting on
  the name. The A/B -> model mapping stays in prompts/replay/pick_state_*.json,
  and `python replay.py card` is what puts the two back together.

  One file, no network requests, opens from file://.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e2e2e2;
    --panel: #fafafa; --accent: #2b5faa; --accentbg: #e8f0fb; --warn: #9a6b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2e3238;
      --panel: #1c1f24; --accent: #7aa7e8; --accentbg: #1d2a3d; --warn: #d8b459;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 10px 20px;
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .bar { flex: 1 1 120px; height: 4px; background: var(--line); border-radius: 2px; min-width: 80px; }
  .bar > span { display: block; height: 4px; background: var(--accent); border-radius: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  .prompt { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            padding: 12px 16px; margin-bottom: 16px; white-space: pre-wrap; word-break: break-word; }
  .prompt details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .col { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .col.chosen { border: 2px solid var(--accent); }
  .col > .head { padding: 6px 12px; font-weight: 600; font-size: 13px;
                 border-bottom: 1px solid var(--line); color: var(--muted); }
  .body { padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
  .body table { border-collapse: collapse; margin: 8px 0; width: 100%; white-space: normal; font-size: 13px; }
  .body th, .body td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .body pre { background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
              padding: 8px 10px; overflow-x: auto; white-space: pre; font-size: 12.5px; }
  .body code { background: var(--panel); padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
  .body .mdh { display: block; font-weight: 700; margin: 10px 0 2px; }
  .cut { color: var(--warn); font-size: 12px; padding: 0 14px 10px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  button.on { background: var(--accentbg); border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  kbd { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line);
        border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .tags button { font-size: 12px; padding: 3px 10px; }
  .done { text-align: center; padding: 60px 20px; }
  .done h2 { font-size: 18px; font-weight: 600; }
  .spacer { flex: 1; }
</style>

<header>
  <h1>Pick</h1>
  <span class="muted" id="prog"></span>
  <span class="bar"><span id="barfill" style="width:0"></span></span>
  <span class="muted"><kbd>←</kbd> A <kbd>→</kbd> B <kbd>↓</kbd> tie <kbd>X</kbd> both bad
    <kbd>1</kbd>–<kbd>4</kbd> reason <kbd>Backspace</kbd> back</span>
  <button class="primary" id="dl">Download picks</button>
</header>

<div class="wrap" id="app"></div>

<script>
const BUNDLE = /*__BUNDLE__*/null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

// Same minimal markdown as grade_template.html: escape first, then add tags,
// so answer text can never introduce markup of its own.
function md(src) {
  let s = esc(src);
  s = s.replace(/```[a-z]*\n([\s\S]*?)```/gi, (m, c) => `<pre>${c}</pre>`);
  s = s.replace(/(?:^\|.*\|[ \t]*\n?){2,}/gm, (block) => {
    const rows = block.trimEnd().split("\n").map(r => r.trim()).filter(r => r.startsWith("|"));
    const cells = rows.map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    const body = cells.filter(row => !row.every(c => /^:?-{2,}:?$/.test(c)));
    if (body.length < 2) return block;
    return "<table><thead><tr>" + body[0].map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>"
      + body.slice(1).map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("")
      + "</tbody></table>";
  });
  s = s.replace(/^\s*#{1,6}\s+(.+)$/gm, '<span class="mdh">$1</span>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<i>$2</i>");
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/^([ \t]*)[-*+][ \t]+/gm, "$1• ");
  return s;
}

const KEY = "replay_pick_" + BUNDLE.bundle_id;
const state = { picks: {}, i: 0, tags: [] };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved) { state.picks = saved.picks || {}; state.i = saved.i || 0; }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({picks: state.picks, i: state.i})); } catch (e) {} };

let shownAt = 0;
let busy = false;

function firstOpen() {
  const k = BUNDLE.items.findIndex(it => !state.picks[it.id]);
  return k === -1 ? BUNDLE.items.length : k;
}

function progress() {
  const n = Object.keys(state.picks).filter(id => BUNDLE.items.some(it => it.id === id)).length;
  $("#prog").textContent = `${n} of ${BUNDLE.items.length} picked`;
  $("#barfill").style.width = (100 * n / Math.max(1, BUNDLE.items.length)) + "%";
}

function render() {
  progress();
  if (state.i >= BUNDLE.items.length) {
    $("#app").innerHTML = `<div class="done"><h2>All picked</h2>
      <p class="muted">Download your picks, then run<br><code>python replay.py card &lt;that file&gt;</code></p>
      <p><button id="back2">Go back</button></p></div>`;
    $("#back2").onclick = back;
    return;
  }
  const it = BUNDLE.items[state.i];
  const prev = state.picks[it.id];
  state.tags = prev ? [...(prev.tags || [])] : [];
  const long = it.prompt.length > 600;
  const prompt = long
    ? `${esc(it.prompt.slice(0, 600))}…<details><summary>show the whole prompt</summary>${esc(it.prompt)}</details>`
    : esc(it.prompt);
  const cut = (flag, side) => flag ? `<div class="cut">${side} was cut off at the length cap, by the harness, not the model.</div>` : "";
  $("#app").innerHTML = `
    <div class="prompt">${prompt}</div>
    <div class="cols">
      <div class="col" id="colA"><div class="head">A</div><div class="body">${md(it.a)}</div>${cut(it.a_cut, "A")}</div>
      <div class="col" id="colB"><div class="head">B</div><div class="body">${md(it.b)}</div>${cut(it.b_cut, "B")}</div>
    </div>
    <div class="controls">
      <button data-c="a">← A is better</button>
      <button data-c="tie">↓ Tie</button>
      <button data-c="b">B is better →</button>
      <button data-c="both_bad">X Both bad</button>
      <span class="spacer"></span>
      <button id="back" ${state.i === 0 ? "disabled" : ""}>Back</button>
    </div>
    <div class="tags"><span class="muted">Why, if you like:</span>
      ${BUNDLE.tags.map((t, k) => `<button data-t="${k}" class="${state.tags.includes(t) ? "on" : ""}">${k + 1} ${esc(t)}</button>`).join("")}
    </div>`;
  if (prev) {
    if (prev.choice === "a") $("#colA").classList.add("chosen");
    if (prev.choice === "b") $("#colB").classList.add("chosen");
    const btn = document.querySelector(`[data-c="${prev.choice}"]`);
    if (btn) btn.classList.add("on");
  }
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => choose(b.dataset.c));
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => toggleTag(+b.dataset.t));
  $("#back").onclick = back;
  shownAt = performance.now();
  window.scrollTo(0, 0);
}

function toggleTag(k) {
  const t = BUNDLE.tags[k];
  if (!t) return;
  state.tags = state.tags.includes(t) ? state.tags.filter(x => x !== t) : [...state.tags, t];
  const btn = document.querySelector(`[data-t="${k}"]`);
  if (btn) btn.classList.toggle("on", state.tags.includes(t));
}

function choose(c) {
  if (busy || state.i >= BUNDLE.items.length) return;
  const it = BUNDLE.items[state.i];
  state.picks[it.id] = { choice: c, tags: [...state.tags], at: new Date().toISOString(),
                         ms: Math.round(performance.now() - shownAt) };
  if (c === "a") $("#colA").classList.add("chosen");
  if (c === "b") $("#colB").classList.add("chosen");
  busy = true;
  // a beat of feedback, then the next unpicked prompt
  setTimeout(() => { busy = false; state.i = firstOpen(); save(); render(); }, 180);
}

function back() {
  if (state.i > 0) { state.i--; save(); render(); }
}

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const map = { ArrowLeft: "a", ArrowRight: "b", ArrowDown: "tie", "=": "tie", x: "both_bad", X: "both_bad" };
  if (map[e.key]) { e.preventDefault(); choose(map[e.key]); return; }
  if (/^[1-9]$/.test(e.key)) { toggleTag(+e.key - 1); return; }
  if (e.key === "Backspace") { e.preventDefault(); back(); }
});

$("#dl").onclick = () => {
  const out = { bundle_id: BUNDLE.bundle_id, submitted: new Date().toISOString(), picks: state.picks };
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `picks_${BUNDLE.bundle_id}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

state.i = firstOpen();  // resume at the first prompt not yet picked
render();
</script>
